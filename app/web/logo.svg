<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>声替 CoverMe · 应用图标</title>
  <defs>
    <!-- 深色宣纸背景 -->
    <radialGradient id="bg" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#2e2a24"/>
      <stop offset="100%" stop-color="#1a1917"/>
    </radialGradient>
    <!-- 朱砂红渐变（左半：原唱） -->
    <linearGradient id="verm-left" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8a251b"/>
      <stop offset="100%" stop-color="#d16e64"/>
    </linearGradient>
    <!-- 古金渐变（右半：你的声音） -->
    <linearGradient id="gold-right" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#82581c"/>
      <stop offset="100%" stop-color="#e9be64"/>
    </linearGradient>
    <!-- 中心光晕 -->
    <radialGradient id="glow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef7f3"/>
      <stop offset="100%" stop-color="#d16e64"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 装饰外圈（极细金边，模拟印章边框） -->
  <rect x="16" y="16" width="480" height="480" rx="104"
        fill="none" stroke="rgba(198,138,46,.18)" stroke-width="2"/>

  <!-- 左半：原唱声波 — 朱砂红，从下往上渐亮 -->
  <g fill="url(#verm-left)">
    <rect x="231" y="224" width="18" height="64"  rx="9"/>
    <rect x="203" y="204" width="18" height="104" rx="9"/>
    <rect x="175" y="182" width="18" height="148" rx="9"/>
    <rect x="147" y="163" width="18" height="186" rx="9"/>
    <rect x="119" y="151" width="18" height="210" rx="9"/>
    <rect x="91"  y="172" width="18" height="168" rx="9"/>
    <rect x="63"  y="197" width="18" height="118" rx="9"/>
    <rect x="35"  y="221" width="18" height="70"  rx="9"/>
  </g>

  <!-- 右半：你的声音 — 古金色，从下往上渐亮 -->
  <g fill="url(#gold-right)">
    <rect x="263" y="224" width="18" height="64"  rx="9"/>
    <rect x="291" y="204" width="18" height="104" rx="9"/>
    <rect x="319" y="182" width="18" height="148" rx="9"/>
    <rect x="347" y="163" width="18" height="186" rx="9"/>
    <rect x="375" y="151" width="18" height="210" rx="9"/>
    <rect x="403" y="172" width="18" height="168" rx="9"/>
    <rect x="431" y="197" width="18" height="118" rx="9"/>
    <rect x="459" y="221" width="18" height="70"  rx="9"/>
  </g>

  <!-- 换声瞬间 — 暖白色光点，模拟印泥中心 -->
  <circle cx="256" cy="256" r="10" fill="url(#glow)" opacity=".95"/>

  <!-- 底部小印章标记（朱砂方块） -->
  <rect x="236" y="410" width="40" height="40" rx="6"
        fill="#d16e64" opacity=".85"/>
  <text x="256" y="438" text-anchor="middle"
        font-family="KaiTi, STKaiti, serif" font-size="22"
        fill="#1a1917" font-weight="700">声</text>
</svg>
