<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280">
  <title>声替 CoverMe · 横向标志</title>
  <defs>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="c2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="g2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 图标（透明底版） -->
  <g>
    <g fill="url(#p2)">
      <rect x="96"  y="112" width="14" height="48"  rx="7"/>
      <rect x="75"  y="97"  width="14" height="78"  rx="7"/>
      <rect x="54"  y="81"  width="14" height="110" rx="7"/>
      <rect x="33"  y="67"  width="14" height="138" rx="7"/>
      <rect x="12"  y="58"  width="14" height="156" rx="7"/>
    </g>
    <g fill="url(#c2)">
      <rect x="110" y="112" width="14" height="48"  rx="7"/>
      <rect x="131" y="97"  width="14" height="78"  rx="7"/>
      <rect x="152" y="81"  width="14" height="110" rx="7"/>
      <rect x="173" y="67"  width="14" height="138" rx="7"/>
      <rect x="194" y="58"  width="14" height="156" rx="7"/>
    </g>
    <circle cx="107" cy="136" r="7" fill="#FFFFFF" filter="url(#g2)"/>
  </g>
  <!-- 字标 -->
  <text x="240" y="160" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="96" font-weight="700" fill="#F4F6FF">声替</text>
  <text x="446" y="158" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="64" font-weight="500" fill="#8FA3D9">CoverMe</text>
  <text x="243" y="216" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="26" fill="#6B7BAF">用你的声音，唱你喜欢的歌</text>
</svg>
