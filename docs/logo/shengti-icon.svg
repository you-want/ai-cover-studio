<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>声替 CoverMe · 应用图标</title>
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#1E2447"/>
      <stop offset="1" stop-color="#0B0E1D"/>
    </radialGradient>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="c" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 左半：原唱声波（紫） / 右半：你的声波（青），镜像 = 换声 -->
  <g fill="url(#p)">
    <rect x="231" y="224" width="18" height="64"  rx="9"/>
    <rect x="203" y="204" width="18" height="104" rx="9"/>
    <rect x="175" y="182" width="18" height="148" rx="9"/>
    <rect x="147" y="163" width="18" height="186" rx="9"/>
    <rect x="119" y="151" width="18" height="210" rx="9"/>
    <rect x="91"  y="172" width="18" height="168" rx="9"/>
    <rect x="63"  y="197" width="18" height="118" rx="9"/>
    <rect x="35"  y="221" width="18" height="70"  rx="9"/>
  </g>
  <g fill="url(#c)">
    <rect x="263" y="224" width="18" height="64"  rx="9"/>
    <rect x="291" y="204" width="18" height="104" rx="9"/>
    <rect x="319" y="182" width="18" height="148" rx="9"/>
    <rect x="347" y="163" width="18" height="186" rx="9"/>
    <rect x="375" y="151" width="18" height="210" rx="9"/>
    <rect x="403" y="172" width="18" height="168" rx="9"/>
    <rect x="431" y="197" width="18" height="118" rx="9"/>
    <rect x="459" y="221" width="18" height="70"  rx="9"/>
  </g>
  <!-- 换声瞬间 -->
  <circle cx="256" cy="256" r="9" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
